services:
  db:
    image: postgres:16-slim
    restart: on-failure
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpass_dev_2024
      POSTGRES_DB: excelmind
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d excelmind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgres://botuser:botpass_dev_2024@db:5432/excelmind
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "npm ci && exec node --watch src/index.js"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all(['/', '/api/status'].map(async path => { try { const res = await fetch('http://127.0.0.1:3000' + path, {signal: AbortSignal.timeout(3000)}); if (!res.ok) throw new Error('HTTP ' + res.status); if (path === '/api/status' && typeof (await res.json()).connection !== 'string') throw new Error('Missing bot connection status'); } catch (error) { console.error('Dashboard service failed at ' + path + ': ' + error.message); process.exitCode = 1; } }));"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
